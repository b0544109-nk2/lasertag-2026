<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>入力ページ｜#ウィンターレーザータグ会2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b1020; --panel:#141b33; --panel2:#1b2443; --line:#2b3763; --ink:#eef3ff; --dim:#9aa6cf;
         --cyan:#35e0ff; --pink:#ff4fa3; --lime:#b6ff3c; --amber:#ffc23c; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:clip;
    font-family:"Kosugi Maru","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-synthesis:none}
  .wrap{max-width:640px;margin:0 auto;padding:18px 14px 90px}
  .pop,h1,h2,.tabs button,.go,.num{font-family:"Mochiy Pop One","Kosugi Maru",sans-serif}
  h1{font-size:1.25rem;margin:4px 0 2px}
  .sub{color:var(--dim);font-size:.82rem;margin:0 0 12px}
  .sub a{color:var(--amber)}
  .chip{position:sticky;top:8px;z-index:5;display:block;text-align:center;border-radius:999px;padding:8px 12px;font-weight:800;font-size:.84rem;
    background:var(--panel2);border:2px solid var(--line);margin:0 0 14px}
  .chip.ok{border-color:var(--lime);color:var(--lime)}
  .chip.wait{border-color:var(--amber);color:var(--amber)}
  .chip.trial{border-color:var(--pink);color:var(--pink)}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 12px;margin:14px 0}
  h2{font-size:.98rem;margin:0 0 10px}
  details>summary{cursor:pointer;list-style:none;font-family:"Mochiy Pop One","Kosugi Maru",sans-serif;font-size:.98rem}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:" ▼";color:var(--dim);font-size:.7rem}
  details[open]>summary::after{content:" ▲"}
  .tag{display:inline-block;border-radius:999px;font-weight:800;font-size:.84rem;line-height:1;padding:7px 12px;white-space:nowrap}
  .dim{color:var(--dim);font-size:.8rem;line-height:1.6}

  label{display:block;color:var(--dim);font-size:.76rem;font-weight:800;margin:10px 0 4px}
  input[type=text],textarea,.num{width:100%;background:#0e1530;color:var(--ink);border:2px solid var(--line);border-radius:10px;
    padding:10px;font:inherit;font-size:16px}
  textarea{min-height:64px;resize:vertical;line-height:1.5}
  input:focus,textarea:focus{outline:none;border-color:var(--cyan)}
  .teamrow{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:12px}
  .teamrow:first-of-type{border-top:none;margin-top:6px}
  button{font:inherit;cursor:pointer}
  .go{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:1rem;color:#0b1020;background:var(--cyan);margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
  .go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
  .go.small{padding:10px;font-size:.9rem}
  .ghost{background:transparent;color:var(--dim);border:2px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:800;font-size:.82rem}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
  .tabs button{font-size:.85rem;color:var(--dim);background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:8px 14px}
  .tabs button[aria-pressed="true"]{color:#0b1020;background:var(--cyan);border-color:var(--cyan)}
  .match{border:2px solid var(--line);border-radius:14px;margin:10px 0;background:var(--panel2);overflow:hidden}
  .match.next{border-color:var(--lime)}
  .mhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--ink);padding:12px 10px;text-align:left}
  .mhead .no{color:var(--dim);font-weight:800;width:1.4em}
  .mhead .vs{color:var(--dim);font-size:.75rem;font-weight:800}
  .mhead .res{margin-left:auto;font-weight:800;white-space:nowrap;font-size:.9rem}
  .mhead .res.done{flex-basis:100%;text-align:right}
  .res.done{color:var(--lime)} .res.todo{color:var(--dim);font-size:.8rem}
  .mbody{padding:2px 10px 12px;border-top:1px dashed var(--line)}
  .side{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
  .side .tag{white-space:normal;line-height:1.3}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:#0e1530;color:var(--ink);font-size:1.4rem;font-weight:800;line-height:1}
  .step button:active{background:var(--line)}
  .num{width:74px;text-align:center;font-size:1.3rem;padding:8px 4px}
  .quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
  .rowbtn{display:flex;gap:8px;margin-top:10px}
  .rowbtn .ghost{flex:1}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:60;background:var(--lime);color:#0b1020;font-weight:800;
    font-size:.9rem;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>✏️ 入力ページ</h1>
  <p class="sub">#ウィンターレーザータグ会2026 ・ <a href="./">みんなが見るページ →</a></p>
  <div class="chip" id="chip">読みこみ中…</div>

  <section class="card">
    <details id="teamBox">
      <summary>👥 チーム名とメンバー</summary>
      <div id="teamForm"></div>
    </details>
  </section>

  <section class="card">
    <h2>⚔️ スコア</h2>
    <div class="tabs" id="tabs"></div>
    <p class="dim" id="ruleHint"></p>
    <div id="matchList"></div>
  </section>

  <p class="dim">このページのURLを知っている人は誰でも入力できます。幹事とお手伝いの人だけに教えてください。<br>
  まちがえたら同じ試合をもう一度入れれば上書きされます。</p>
  <p><button class="ghost" id="trialClear" hidden>おためしで入れた内容をぜんぶ消す</button></p>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
var S = { data:null, rule:null, open:{}, draft:{}, teamDirty:{}, teamBuilt:false, userPicked:false };

var toastT=null;
function toast(msg){ var el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove("show"); },2400); }
function nextMatch(d){ return d.matches.filter(function(m){ return !played(m); })[0]||null; }

/* ---------- チーム ---------- */
function renderTeams(d){
  var box=document.getElementById("teamForm");
  if(!S.teamBuilt){
    box.innerHTML=d.teams.map(function(t){
      return '<div class="teamrow" data-sym="'+esc(t.sym)+'">'
        +'<span class="tag" style="background:'+t.color+';color:'+textOn(t.color)+'">チーム '+esc(t.sym)+'</span>'
        +'<label for="tn'+esc(t.sym)+'">チーム名</label><input type="text" id="tn'+esc(t.sym)+'" maxlength="20" placeholder="例：わんわんおー" autocomplete="off">'
        +'<label for="tm'+esc(t.sym)+'">メンバー（、か改行で区切る）</label><textarea id="tm'+esc(t.sym)+'" maxlength="300" placeholder="例：あき、もり、天"></textarea>'
        +'<button class="go small" type="button" data-save="'+esc(t.sym)+'">チーム '+esc(t.sym)+' を保存</button></div>';
    }).join("");
    box.addEventListener("input",function(e){ var r=e.target.closest(".teamrow"); if(r) S.teamDirty[r.dataset.sym]=true; });
    box.addEventListener("click",function(e){
      var sym=e.target.dataset&&e.target.dataset.save; if(!sym) return;
      var name=document.getElementById("tn"+sym).value.trim();
      var members=document.getElementById("tm"+sym).value.split(/[\n、,，]+/).map(function(x){return x.trim();}).filter(Boolean).join("、");
      postEntry("team",sym,{name:name,members:members});
      S.teamDirty[sym]=false; toast("チーム "+sym+" を保存しました"); refresh();
    });
    S.teamBuilt=true;
    if(!d.teams.some(function(t){return t.name||t.members;})) document.getElementById("teamBox").open=true;   // まだ何も入っていなければ開いておく
  }
  d.teams.forEach(function(t){
    if(S.teamDirty[t.sym]) return;                       // 書きかけは上書きしない
    var n=document.getElementById("tn"+t.sym), m=document.getElementById("tm"+t.sym);
    if(n&&document.activeElement!==n) n.value=t.name;
    if(m&&document.activeElement!==m) m.value=t.members;
  });
}

/* ---------- スコア ---------- */
function resultText(d,m){
  if(!played(m)) return '<span class="res todo">まだ</span>';
  var mark=m.res==="d"?"△ 引き分け":("○ "+(m.res==="h"?m.home:m.away)+"の勝ち");
  return '<span class="res done">'+(m.hs!=null?m.hs+" - "+m.as+"　":"")+esc(mark)+'</span>';
}
function renderMatches(d){
  var nx=nextMatch(d);
  if(!S.userPicked||!d.rules.some(function(r){return r.name===S.rule;})) S.rule=nx?nx.rule:(S.rule||(d.rules[0]||{}).name);
  var tabs=document.getElementById("tabs"); tabs.innerHTML="";
  d.rules.forEach(function(r){
    var left=d.matches.filter(function(m){return m.rule===r.name&&!played(m);}).length;
    var b=document.createElement("button"); b.type="button"; b.textContent=r.name+(left?"（あと"+left+"）":" ✓");
    b.setAttribute("aria-pressed",String(r.name===S.rule));
    b.onclick=function(){ S.rule=r.name; S.userPicked=true; renderMatches(S.data); };
    tabs.appendChild(b);
  });
  var rule=ruleOf(d,S.rule);
  document.getElementById("ruleHint").textContent="入れる数字："+(rule.unit||"スコア")+(rule.low?"（少ないほうが勝ち）":"（多いほうが勝ち）");
  var list=document.getElementById("matchList");
  list.innerHTML=d.matches.filter(function(m){return m.rule===S.rule;}).map(function(m,i){
    var isNext=nx&&nx.key===m.key, open=(m.key in S.open)?S.open[m.key]:isNext;
    var dr=S.draft[m.key]||{h:m.hs!=null?String(m.hs):"",a:m.as!=null?String(m.as):""};
    var h='<div class="match'+(isNext?' next':'')+'" data-key="'+m.key+'">'
      +'<button class="mhead" type="button" data-toggle="1" aria-expanded="'+open+'"><span class="no">'+(i+1)+'</span>'+pill(d,m.home,true)+'<span class="vs">vs</span>'+pill(d,m.away,true)+resultText(d,m)+'</button>';
    if(open){
      h+='<div class="mbody">';
      [["h",m.home],["a",m.away]].forEach(function(s){
        h+='<div class="side">'+pill(d,s[1],true)+'<div class="step"><button type="button" data-step="-1" data-side="'+s[0]+'" aria-label="'+esc(s[1])+'を1へらす">−</button>'
          +'<input class="num" inputmode="numeric" pattern="[0-9]*" data-side="'+s[0]+'" value="'+esc(dr[s[0]])+'" placeholder="0" aria-label="'+esc(s[1])+'のスコア">'
          +'<button type="button" data-step="1" data-side="'+s[0]+'" aria-label="'+esc(s[1])+'を1ふやす">＋</button></div></div>';
      });
      h+='<button class="go" type="button" data-rec="1">この試合を記録する</button>'
        +'<label>スコアなしで勝ち負けだけ入れる</label><div class="quick">'
        +'<button class="ghost" type="button" data-win="h">'+esc(m.home)+'の勝ち</button><button class="ghost" type="button" data-win="d">引き分け</button><button class="ghost" type="button" data-win="a">'+esc(m.away)+'の勝ち</button></div>'
        +(played(m)?'<div class="rowbtn"><button class="ghost" type="button" data-clear="1">この試合の記録を取り消す</button></div>':'')
        +'</div>';
    }
    return h+'</div>';
  }).join("");
}
document.getElementById("matchList").addEventListener("click",function(e){
  var box=e.target.closest(".match"); if(!box) return;
  var key=box.dataset.key, d=S.data, m=d.matches.filter(function(x){return x.key===key;})[0], t=e.target.closest("button"); if(!t||!m) return;
  var ds=t.dataset;
  if(ds.toggle){ var nx=nextMatch(d); var cur=(key in S.open)?S.open[key]:(nx&&nx.key===key); S.open[key]=!cur; renderMatches(d); return; }
  if(ds.step){
    var inp=box.querySelector('input[data-side="'+ds.side+'"]'), v=Math.max(0,(num(inp.value)||0)+Number(ds.step));
    inp.value=v; saveDraft(box,key); return;
  }
  if(ds.rec){
    var h=num(box.querySelector('input[data-side="h"]').value), a=num(box.querySelector('input[data-side="a"]').value);
    if(h==null||a==null){ toast("両方のチームの数字を入れてください"); return; }
    postEntry("score",key,{h:h,a:a}); done(key,"記録しました"); return;
  }
  if(ds.win){ postEntry("score",key,{w:ds.win}); done(key,"記録しました"); return; }
  if(ds.clear){ if(confirm("この試合の記録を取り消しますか？")){ postEntry("score",key,{clear:1}); done(key,"取り消しました"); } }
});
document.getElementById("matchList").addEventListener("input",function(e){ var box=e.target.closest(".match"); if(box) saveDraft(box,box.dataset.key); });
function saveDraft(box,key){ S.draft[key]={h:box.querySelector('input[data-side="h"]').value,a:box.querySelector('input[data-side="a"]').value}; }
function done(key,msg){ delete S.draft[key]; delete S.open[key]; S.userPicked=false; toast(msg); refresh(); }

/* ---------- 読みこみ ---------- */
function setChip(r){
  var c=document.getElementById("chip");
  if(!LT.live){ c.className="chip trial"; c.textContent="🧪 おためし中：入力はこの端末の中だけに保存されます"; }
  else if(r.stale){ c.className="chip wait"; c.textContent="📡 電波がよくないようです。入力はつながったら自動で送ります"+(r.waiting?"（送信待ち "+r.waiting+"件）":""); }
  else if(r.waiting){ c.className="chip wait"; c.textContent="⏳ 送信中 "+r.waiting+"件（1分ほどで届きます）"; }
  else { c.className="chip ok"; c.textContent="✅ ぜんぶ届いています"; }
  document.getElementById("trialClear").hidden=LT.live;
}
async function refresh(){
  var r=await loadData(); S.data=r.data; setChip(r);
  renderTeams(r.data);
  var ae=document.activeElement;
  if(!(ae&&ae.classList&&ae.classList.contains("num"))) renderMatches(r.data);   // 数字を打っている最中は描き直さない
}
document.getElementById("trialClear").onclick=function(){ if(confirm("この端末に入れたおためしの内容を消しますか？")){ clearLocal(); S.draft={}; S.teamDirty={}; refresh(); toast("消しました"); } };
refresh();
setInterval(refresh, LT.live?15000:60000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) refresh(); });
window.addEventListener("online",refresh);
</script>
</body>
</html>
